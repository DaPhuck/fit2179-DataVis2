<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Australia's Night Sky: A Stargazer's Atlas</title>

    <!-- Vega-Lite libraries -->
    <script src="https://cdn.jsdelivr.net/npm/vega@6"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@6"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@7"></script>

    <style>

        .page {
            max-width: 900px;
            margin: 0 auto;

            margin-bottom: 0.25rem;
        }

            color: #aaa;

        }

        .chart-section {
            margin-bottom: 3rem;
        }

            background: #142035;

            padding: 1.5rem;
        }

<body>
    <div class="page">

        <h1>Australia's Night Sky</h1>

        <!-- C1: Sky Brightness Map -->
        <div class="chart-section">
            <div class="chart-container">
                <div id="chart-c1"></div>

        </div>

        <!-- C2: Sunspot Cycle -->
        <div class="chart-section">
